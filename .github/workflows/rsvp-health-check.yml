name: Christmas Party database health check

on:
  schedule:
    - cron: '7 1,13 * * *' # ~9:07 AM and 9:07 PM Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check RSVP database through existing read-only API
        env:
          HEALTHCHECK_URL: ${{ vars.RSVP_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::Set repository variable RSVP_HEALTHCHECK_URL to the production https://.../api/rsvps endpoint."
            exit 1
          fi
          case "$HEALTHCHECK_URL" in
            https://*/api/rsvps) ;;
            *) echo "::error::Health-check URL must use HTTPS and end with /api/rsvps"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            --max-time 20 \
            --retry 2 \
            -H 'Cache-Control: no-cache' \
            -o /tmp/rsvp-health.json "$HEALTHCHECK_URL"
          python3 - <<'PY'
          import json
          with open('/tmp/rsvp-health.json', encoding='utf-8') as file:
              response = json.load(file)
          if not isinstance(response, list):
              raise SystemExit('Health check failed: RSVP endpoint did not return a guest list.')
          print('RSVP database read succeeded; no RSVP records changed.')
          PY
